<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee8dd">
  <title>我的房間 · Yorozuya</title>
  <link rel="stylesheet" href="/content/test_room.css?v=8">
</head>
<body>
  <header><a href="/" aria-label="回到 Yorozuya">← 萬事屋</a><span>ROOM / 01</span></header>
  <main>
    <div class="heading"><p>一點一點，變成喜歡的樣子。</p><h1>我的房間</h1></div>
    <div class="scene"><canvas id="room" width="416" height="328" role="img" aria-label="4 乘 6 格像素房間，暗色半透明的魅魔人物會在空地走動。可從下方列表加入家具，點選或拖曳家具，雙指縮放。"></canvas></div>
    <div class="controls"><span>4 × 6 <i>／</i> 我的房間</span><button id="grid" type="button" aria-pressed="false">顯示格線</button></div>
    <div class="actor-panel"><div><strong>魅魔・人物占位</strong><p id="actor-status">她會走動，也會找椅子、沙發或床邊坐下休息。</p></div><div class="actor-actions"><button id="actor-sit" type="button">找位置坐</button><button id="actor-stand" type="button" disabled>起身</button><button id="actor-toggle" type="button" aria-pressed="false">暫停動作</button></div></div>
    <section class="furniture-panel" aria-label="選取家具">
      <div id="selection">
        <div class="furniture-info"><img id="item-preview" alt=""><div><strong id="item-name"></strong><p id="item-size"></p></div></div>
        <div class="furniture-actions"><button id="move-item" type="button" aria-pressed="false">移動</button><button id="turn-item" type="button" title="每次旋轉 90 度，切換四個朝向">旋轉</button><button id="remove-item" type="button">收回</button></div>
      </div>
      <p id="empty-selection" hidden>點選房間內的家具，或從下方列表加入。</p>
      <p id="furniture-status" role="status">選好家具，開始布置自己的角落。</p>
    </section>
    <div class="view-controls" role="group" aria-label="房間視角">
      <button id="zoom-out" type="button" aria-label="縮小房間">−</button>
      <output id="zoom-level" aria-label="縮放比例">100%</output>
      <button id="zoom-in" type="button" aria-label="放大房間">＋</button>
      <button id="reset-view" type="button">重置視角</button>
    </div>
    <p class="gesture-hint">拖家具換位置・拖空白處移動畫面<br>雙指或滾輪縮放</p>
    <section class="inventory" aria-label="家具列表">
      <div class="inventory-heading"><h2>家具小舖</h2><span>10 種家具・點一下加入</span></div>
      <div id="furniture-list"></div>
      <div class="inventory-heading"><h2 id="room-count">房間內 1 件</h2><span>點名稱也能選取</span></div>
      <div id="placed-items" aria-label="房間內的家具"></div>
      <p class="note">試擺不花金幣，重新整理會回到初始房間。</p>
    </section>
  </main>
  <footer>YOROZUYA <span>我的一隅</span></footer>
  <script src="/content/room_furniture.js?v=4"></script>
  <script src="/content/room_character.js?v=6"></script>
  <script src="/content/test_room.js?v=10"></script>
</body>
</html>
