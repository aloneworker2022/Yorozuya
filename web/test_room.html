<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee8dd">
  <title>我的房間 · Yorozuya</title>
  <link rel="stylesheet" href="/content/test_room.css?v=4">
</head>
<body>
  <header><a href="/" aria-label="回到 Yorozuya">← 萬事屋</a><span>ROOM / 01</span></header>
  <main>
    <div class="heading"><p>一點一點，變成喜歡的樣子。</p><h1>我的房間</h1></div>
    <div class="scene"><canvas id="room" width="416" height="328" role="img" aria-label="4 乘 6 格像素房間，放著一張鼠尾草綠坐墊木椅。可拖曳椅子擺放，雙指縮放房間。"></canvas></div>
    <div class="controls"><span>4 × 6 <i>／</i> 我的房間</span><button id="grid" type="button" aria-pressed="false">顯示格線</button></div>
    <section class="furniture-panel" aria-label="家具樣品">
      <div class="furniture-info"><img id="chair-preview" alt="鼠尾草木椅"><div><strong>鼠尾草木椅</strong><p>木框・軟坐墊・占地 1 × 1</p></div></div>
      <div class="furniture-actions"><button id="move-chair" type="button" aria-pressed="false">移動位置</button><button id="turn-chair" type="button" title="每次旋轉 90 度，切換四個朝向">朝向：左前 ↙</button></div>
      <p id="chair-status" role="status">拖曳椅子，或按「移動位置」後點選地板。</p>
    </section>
    <div class="view-controls" role="group" aria-label="房間視角">
      <button id="zoom-out" type="button" aria-label="縮小房間">−</button>
      <output id="zoom-level" aria-label="縮放比例">100%</output>
      <button id="zoom-in" type="button" aria-label="放大房間">＋</button>
      <button id="reset-view" type="button">重置視角</button>
    </div>
    <p class="gesture-hint">拖椅子換位置・拖空白處移動畫面<br>雙指或滾輪縮放</p>
    <p class="note">先留一個空間，給未來的日常。</p>
  </main>
  <footer>YOROZUYA <span>我的一隅</span></footer>
  <script src="/content/room_furniture.js?v=2"></script>
  <script src="/content/test_room.js?v=5"></script>
</body>
</html>
