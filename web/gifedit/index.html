<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gifedit · 接客動作潤色</title>
  <link rel="stylesheet" href="/style.css?v=75">
  <style>
    html, body { height: auto !important; overflow: auto !important; }
    body.playing { overflow: hidden !important; }
    body { margin: 0; padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 .2em; }
    .dim { opacity: .72; font-size: .85rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
    label { display: flex; flex-direction: column; gap: .2em; font-size: .85rem; min-width: 8em; flex: 1; }
    button { font: inherit; padding: .4em .75em; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    textarea, input, select {
      font: inherit; width: 100%; box-sizing: border-box; color: inherit;
      background: var(--bg); border: 1px solid var(--line); padding: .35em;
    }
    textarea { min-height: 5.5em; }
    .status { min-height: 1.3em; }
    .status.err { color: var(--red); }
    .frame {
      border: 1px solid var(--line); background: var(--panel);
      padding: .7em; margin: .7em 0;
    }
    .frame-top { display: flex; justify-content: space-between; gap: .6em; align-items: baseline; }
    .pics canvas, .pics img { width: 100%; height: auto; display: block; background: #0003; }
    .pics canvas { image-rendering: pixelated; }
    .pics img { image-rendering: auto; margin-top: .35em; }
    .frame .row label { flex: 0 1 9em; min-width: 7em; }
    .player {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
      padding: .45em .7em calc(.45em + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(18, 12, 34, .94);
      display: flex; flex-wrap: wrap; gap: .45em; align-items: center; justify-content: center;
    }
    .player label { flex: 0 1 9em; min-width: 7em; }
    .player .controls { display: flex; flex-wrap: wrap; gap: .45em; align-items: center; justify-content: center; width: 100%; }
    .player.playing {
      top: 0; bottom: 0; flex-direction: column; flex-wrap: nowrap; justify-content: flex-end;
      overflow: hidden;
      padding-top: calc(.4em + env(safe-area-inset-top));
      background: rgba(8, 6, 16, .97);
    }
    .stage-wrap { display: none; position: relative; width: 100%; flex: 1 1 auto; min-height: 0;
      align-items: center; justify-content: center; flex-direction: column; }
    .player.playing .stage-wrap { display: flex; }
    #btn-exit {
      display: none; position: absolute; top: .35em; right: .35em; z-index: 2;
    }
    .player.playing #btn-exit { display: block; }
    #stage, #stage-img {
      width: min(92vw, 720px); max-height: calc(100vh - 11rem);
      height: auto; object-fit: contain; background: #0003;
    }
    #stage { image-rendering: pixelated; }
    #stage[hidden], #stage-img[hidden] { display: none !important; }
    #play-label { margin: .35em 0 0; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>gifedit</h1>
  <p class="dim">接客偷看的 30 張來源圖，用 Comfy 圖生圖潤色。這頁不寫進遊戲，也不換成房間裡的動畫。</p>
  <p id="status" class="status"></p>

  <div class="row">
    <label>產生模型 <select id="ckpt"><option value="">載入模型清單…</option></select></label>
    <label>動作 <select id="pose"></select></label>
    <label>女子 <select id="who"></select></label>
    <label>男子身形 <select id="man"></select></label>
  </div>

  <label>正向 prompt <textarea id="pos"></textarea></label>
  <label>負向 prompt <textarea id="neg" placeholder="留空＝伺服器預設負向"></textarea></label>
  <p class="dim">選到的女子身材會由伺服器加進正向。這兩欄整組共用。改過正向之後，換動作不會蓋掉；和自動句子一樣時才會跟著換。全部畫完後再按一次「全部產生」，用這一輪當底畫下一輪。「重新開始」回到來源圖。</p>
  <button id="btn-load" type="button">載入這個動作的全部圖片</button>
  <div id="frames"></div>
</main>
<div class="player" id="player">
  <div class="stage-wrap">
    <button id="btn-exit" type="button">離開</button>
    <canvas id="stage" hidden></canvas>
    <img id="stage-img" alt="" hidden>
    <p id="play-label" class="dim"></p>
  </div>
  <div class="controls">
    <label>共同 noisdens <input id="denoise" type="number" min="0.25" max="0.9" step="0.05" value="0.3"></label>
    <label>seed <input id="seed" type="number" min="1" step="1" placeholder="空＝隨機後固定"></label>
    <button id="btn-all" type="button">全部產生</button>
    <button id="btn-restart" type="button">重新開始</button>
    <button id="btn-play" type="button">測試動畫</button>
  </div>
</div>
<script src="/content/room_doll.js?v=10"></script>
<script type="module" src="/content/gifedit.js?v=6"></script>
</body>
</html>
