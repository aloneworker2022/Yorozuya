<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jspace 測驗 / test_jspace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0c1a0c;
    color: #d8ecd0;
    font-family: system-ui, "Cubic 11", "Segoe UI", monospace;
    font-size: 15px;
    line-height: 1.45;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: .75em .75em 1.2em;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    color: #7dff9a;
    font-size: 1.15em;
    letter-spacing: .14em;
    margin-bottom: .15em;
  }
  .sub {
    color: #8aaf82;
    font-size: .78em;
    margin-bottom: .7em;
  }
  .warn {
    color: #c8d99a;
    font-size: .75em;
    margin-bottom: .85em;
    text-align: center;
  }
  a { color: #6fe3e1; }
  .stage-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    touch-action: manipulation;
  }
  canvas#stage {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: auto;
    height: auto;
    max-width: 100%;
    border: 3px solid #2a4a28;
    border-radius: 4px;
    background: #1a3a18;
    cursor: pointer;
    box-shadow: 0 0 0 1px #0a180a, 0 8px 24px rgba(0,0,0,.45);
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: .45em;
    justify-content: center;
    margin-top: .85em;
    width: 100%;
  }
  button {
    background: rgba(125, 255, 154, .14);
    border: 1px solid rgba(125, 255, 154, .35);
    border-radius: 8px;
    color: #9dffb0;
    font: inherit;
    font-size: .88em;
    padding: .5em 1em;
    cursor: pointer;
    min-height: 44px;
  }
  button:hover, button:focus-visible {
    background: rgba(125, 255, 154, .28);
    outline: none;
  }
  button.on {
    background: rgba(111, 227, 225, .22);
    border-color: rgba(111, 227, 225, .5);
    color: #6fe3e1;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .hint {
    margin-top: .65em;
    font-size: .78em;
    color: #7a9a72;
    text-align: center;
    min-height: 1.4em;
  }
  .badge {
    display: inline-block;
    font-size: .7em;
    letter-spacing: .08em;
    padding: .12em .45em;
    border-radius: 4px;
    background: rgba(125, 255, 154, .16);
    color: #7dff9a;
    vertical-align: middle;
    margin-left: .35em;
  }
</style>
</head>
<body>
<h1>Jspace <span class="badge">車居綠活</span></h1>
<p class="sub">測驗頁 · 草皮外觀 ↔ 透視駕駛座（之後可升正式功能）</p>
<div class="warn">
  測驗頁（未接主遊戲）。點車體或「透視內部」切換；後艙暫空。<br>
  <a href="/testword">← Testword</a> · <a href="/test_sex">性愛場景測試</a> · <a href="/test_date">約會測試</a> · <a href="/">回遊戲</a>
</div>

<div class="stage-wrap">
  <canvas id="stage" width="160" height="120" aria-label="Jspace 場景"></canvas>
</div>

<div class="toolbar" role="toolbar" aria-label="視圖切換">
  <button type="button" id="btn-ext" class="on">外觀</button>
  <button type="button" id="btn-cut">透視內部</button>
</div>
<p class="hint" id="hint">點擊車輛進入透視內部 · 駕駛座／後艙（空）</p>

<script src="/content/test_jspace.js"></script>
</body>
</html>
