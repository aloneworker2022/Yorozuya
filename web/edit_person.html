<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Person — 人物生成池編輯</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #12101c; color: #d8d0ec; font-family: system-ui, "Cubic 11", monospace;
         font-size: 15px; padding: 1em; max-width: 760px; margin: 0 auto; line-height: 1.5; }
  h1 { color: #ff4fd8; font-size: 1.2em; letter-spacing: .1em; margin-bottom: .2em; }
  .warn { color: #ff9d4d; font-size: .8em; margin-bottom: 1em; }
  section { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px; padding: 1em 1.1em; margin-bottom: 1em; }
  h2 { color: #6fe3e1; font-size: .9em; letter-spacing: .1em; }
  details > summary { cursor: pointer; padding: .3em 0; }
  details[open] > summary { margin-bottom: .5em; }
  .mini { font-size: .78em; color: #8a82a5; }
  label { display: block; font-size: .75em; color: #9a92b5; margin: .5em 0 .2em; }
  input, textarea, select { width: 100%; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1);
    border-radius: 7px; color: #d8d0ec; font: inherit; padding: .45em .6em; outline: none; }
  textarea { min-height: 4.5em; resize: vertical; line-height: 1.55; }
  textarea.lines { min-height: 8em; }
  .row { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; }
  button { background: rgba(255,79,216,.18); border: none; border-radius: 7px; color: #ff8fe6;
           font: inherit; padding: .45em .9em; cursor: pointer; }
  button:hover { background: rgba(255,79,216,.3); }
  button.cy { background: rgba(111,227,225,.16); color: #6fe3e1; }
  button.del { background: rgba(255,95,122,.18); color: #ff8fa3; padding: .25em .6em; font-size: .8em; }
  .tabs { display: flex; gap: .4em; margin-bottom: 1em; }
  .tabs button { background: rgba(255,255,255,.05); color: #9a92b5; padding: .55em 1.3em; }
  .tabs button.on { background: rgba(111,227,225,.2); color: #6fe3e1; }
  .card { border-top: 1px solid rgba(255,255,255,.08); padding: .6em 0; }
  .itemrow { display: grid; grid-template-columns: 1fr auto auto auto; gap: .4em; align-items: center; margin: .3em 0; }
  .itemrow input[type=checkbox] { width: auto; }
  .itemrow select { width: 6.5em; }
  .nsfw-tag { font-size: .7em; color: #ff8fa3; }
  .savebar { position: sticky; bottom: 0; background: #12101c; padding: .8em 0; border-top: 1px solid rgba(255,255,255,.1); }
  .status { font-size: .8em; color: #6bcb77; min-height: 1.2em; }
  .status.err { color: #ff5f7a; }
  a { color: #6fe3e1; }
</style>
</head>
<body>
<h1>⚙ Edit Person — 人物生成池</h1>
<div class="warn">召喚時的所有抽取池都在這裡。勾「18+」的項目只在遊戲分級為 NSFW 時參與抽取(SFW 模式看不到)。改完按最下方儲存,寫回 persona_pools.json,遊戲重整後生效。<a href="/testword">← Testword</a> | <a href="/">回遊戲</a></div>

<div class="tabs" id="g-tabs">
  <button data-g="female" class="on">女子(魅魔)</button>
  <button data-g="male">男子(召喚師)</button>
</div>

<div id="editor"></div>

<div class="savebar">
  <div class="row">
    <button onclick="saveAll()">💾 儲存全部</button>
    <span class="status" id="save-status"></span>
  </div>
</div>

<script>
let POOLS = null, curG = "female";
const GRADES = ["N","R","S","SR","SSR"];
const RARITIES = ["普通","稀有","史詩","傳說"];

async function api(path, method="GET", body=null) {
  const r = await fetch(path, { method, headers: body ? {"Content-Type":"application/json"} : {},
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.status === 204 ? null : r.json();
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ── 欄位型別:lines(一行一項)/ graded(text+grade)/ flagged(text+18+)/
//    traits(name+rarity+cat+18+)/ occupations / archetypes / libido / chronotypes / hobby_pool ──
const SCHEMA = {
  female: [
    ["names", "lines", "名字池"],
    ["archetypes", "archetypes", "個性原型(骨幹:語氣/口頭禪/情緒反應/數值)"],
    ["occupations", "occupations", "職業池(被召喚前的人生;含評級/作息/職業澄清)"],
    ["attitudes", "lines", "被召喚的態度"],
    ["likes", "lines", "喜歡的東西"],
    ["dislikes", "lines", "討厭的東西(雷點)"],
    ["quirks", "flagged", "小習慣/祕密(反差設定素材)"],
    ["hobby_pool", "hobby_pool", "興趣池(依氣質分桶,原型加權抽)"],
    ["chronotypes", "chronotypes", "睡眠型(生理時鐘)"],
    ["arcs", "lines", "近期人生事件"],
    ["libido", "libido", "性慾傾向"],
    ["appearance.build", "graded", "體型(含評級)"],
    ["appearance.bust", "graded", "乳房大小／形狀(含評級;生圖英文見 sdtags BUST)"],
    ["appearance.areola", "graded", "乳暈大小／顏色(含評級;多 nsfw;生圖見 sdtags AREOLA)"],
    ["appearance.face", "lines", "臉型"],
    ["appearance.eyes", "graded", "眼睛形狀(含評級)"],
    ["appearance.eye_color", "graded", "瞳孔顏色(含評級;生圖見 sdtags EYE_COLOR)"],
    ["appearance.mouth", "lines", "嘴巴"],
    ["appearance.hair", "lines", "髮型(只講形狀,顏色在下一欄)"],
    ["appearance.hair_color", "lines", "髮色"],
    ["appearance.style", "lines", "穿搭風格(個人喜好衣櫃:朋友解 1 套、女友 3 套、妻子 6 套)"],
    ["appearance.feature", "lines", "小特徵"],
    ["special_traits", "traits", "特殊屬性(抽卡 1~3 個;⚪普通 🔵稀有 🟣史詩 🌟傳說)"],
  ],
  // 男子=召喚師,獨立資料源(summoners.json),用專屬編輯器,不走 SCHEMA
};

function getPath(obj, path) { return path.split(".").reduce((o,k)=>o?.[k], obj); }
function setPath(obj, path, v) {
  const ks = path.split("."); let o = obj;
  for (const k of ks.slice(0,-1)) o = o[k] ??= {};
  o[ks[ks.length-1]] = v;
}

function render() {
  if (curG === "male") return renderSummoners();
  const G = POOLS[curG];
  const el = document.getElementById("editor");
  el.innerHTML = SCHEMA[curG].map(([path, type, title], si) => {
    const data = getPath(G, path) ?? (type==="hobby_pool" ? {} : []);
    return `<section><details ${si<1?"open":""}><summary><h2 style="display:inline">${title} <span class="mini">(${type==="hobby_pool"?Object.values(data).flat().length:data.length} 項)</span></h2></summary>
      <div data-sec="${path}" data-type="${type}">${renderSec(type, data, path)}</div>
    </details></section>`;
  }).join("");
}

function renderSec(type, data, path) {
  if (type === "lines")
    return `<div class="mini">一行一項</div><textarea class="lines" data-lines>${esc(data.join("\n"))}</textarea>`;
  if (type === "graded")
    return data.map((x,i)=>`<div class="itemrow" data-i="${i}">
        <input value="${esc(x.text)}" data-f="text">
        <select data-f="grade">${GRADES.map(g=>`<option ${x.grade===g?"selected":""}>${g}</option>`).join("")}</select>
        <span></span><button class="del" onclick="delItem(this)">✕</button></div>`).join("")
      + `<button class="cy" onclick="addItem(this,'graded')">＋新增</button>`;
  if (type === "flagged")
    return data.map((x,i)=>`<div class="itemrow" data-i="${i}">
        <input value="${esc(x.text)}" data-f="text">
        <label class="nsfw-tag" style="display:flex;gap:.2em;align-items:center;margin:0">18+<input type="checkbox" data-f="nsfw" ${x.nsfw?"checked":""}></label>
        <span></span><button class="del" onclick="delItem(this)">✕</button></div>`).join("")
      + `<button class="cy" onclick="addItem(this,'flagged')">＋新增</button>`;
  if (type === "traits")
    return data.map((x,i)=>`<div class="itemrow" data-i="${i}" style="grid-template-columns:1fr 6.5em 5em auto auto">
        <input value="${esc(x.name)}" data-f="name">
        <select data-f="rarity">${RARITIES.map(r=>`<option ${x.rarity===r?"selected":""}>${r}</option>`).join("")}</select>
        <input value="${esc(x.cat)}" data-f="cat" title="同類不重複的分類鍵">
        <label class="nsfw-tag" style="display:flex;gap:.2em;align-items:center;margin:0">18+<input type="checkbox" data-f="nsfw" ${x.nsfw?"checked":""}></label>
        <button class="del" onclick="delItem(this)">✕</button></div>`).join("")
      + `<button class="cy" onclick="addItem(this,'traits')">＋新增</button>`;
  if (type === "occupations")
    return data.map((x,i)=>`<div class="card" data-i="${i}">
        <div class="row"><input value="${esc(x.name)}" data-f="name" placeholder="職業名" style="flex:1">
          <select data-f="grade" style="width:6.5em">${GRADES.map(g=>`<option ${x.grade===g?"selected":""}>${g}</option>`).join("")}</select>
          <label class="nsfw-tag" style="display:flex;gap:.2em;align-items:center;margin:0">18+<input type="checkbox" data-f="nsfw" ${x.nsfw?"checked":""}></label>
          <button class="del" onclick="delItem(this)">✕</button></div>
        <label>人生描述(組進 backstory)</label><input value="${esc(x.life)}" data-f="life">
        <label>生涯服裝(她平常穿這身;立繪預設就畫這套,對照表在 server/sdtags.py 的 CAREER_OUTFIT)</label>
        <input value="${esc(x.outfit||"")}" data-f="outfit" placeholder="例:水手服制服">
        <label>職業澄清(給 AI,可空)</label><input value="${esc(x.desc||"")}" data-f="desc">
        <label>四時段作息(早/午/下午/晚;留空用通用)</label>
        <div class="row">${[0,1,2,3].map(j=>`<input value="${esc((x.sch||[])[j]||"")}" data-f="sch${j}" style="flex:1;min-width:9em">`).join("")}</div>
      </div>`).join("") + `<button class="cy" onclick="addItem(this,'occupations')">＋新增職業</button>`;
  if (type === "archetypes")
    return data.map((x,i)=>`<div class="card" data-i="${i}">
        <div class="row"><input value="${esc(x.name)}" data-f="name" placeholder="原型名" style="flex:1">
          <label class="nsfw-tag" style="display:flex;gap:.2em;align-items:center;margin:0">18+<input type="checkbox" data-f="nsfw" ${x.nsfw?"checked":""}></label>
          <button class="del" onclick="delItem(this)">✕</button></div>
        <label>語氣描述(給 AI 的說話方式)</label><textarea data-f="tone">${esc(x.tone)}</textarea>
        <label>口頭禪(、分隔)</label><input value="${esc((x.catchphrases||[]).join("、"))}" data-f="catchphrases">
        <div class="row">
          ${["開心","低落","生氣","不安"].map(k=>`<span style="flex:1;min-width:10em"><label>反應:${k}</label><input value="${esc((x.reactions||{})[k]||"")}" data-f="re_${k}"></span>`).join("")}
        </div>
        <div class="row">
          ${[["proactivity","主動度"],["shyness","害羞"],["jealousy","吃醋"],["loyalty","忠誠"]].map(([f,l])=>`<span style="flex:1;min-width:6em"><label>${l}(0~100)</label><input type="number" min="0" max="100" value="${x[f]??50}" data-f="${f}"></span>`).join("")}
          <span style="flex:2;min-width:10em"><label>偏好興趣桶(、分隔)</label><input value="${esc((x.hobby_vibes||[]).join("、"))}" data-f="hobby_vibes"></span>
        </div>
      </div>`).join("") + `<button class="cy" onclick="addItem(this,'archetypes')">＋新增原型</button>`;
  if (type === "libido")
    return data.map((x,i)=>`<div class="card" data-i="${i}">
        <div class="row"><input value="${esc(x.name)}" data-f="name" placeholder="傾向名" style="flex:1">
          <select data-f="grade" style="width:6.5em">${GRADES.map(g=>`<option ${x.grade===g?"selected":""}>${g}</option>`).join("")}</select>
          <span style="width:8em"><input type="number" value="${x.shyness_delta||0}" data-f="shyness_delta" title="害羞度增減"></span>
          <label class="nsfw-tag" style="display:flex;gap:.2em;align-items:center;margin:0">18+<input type="checkbox" data-f="nsfw" ${x.nsfw?"checked":""}></label>
          <button class="del" onclick="delItem(this)">✕</button></div>
        <label>描述(給 AI)</label><textarea data-f="desc">${esc(x.desc)}</textarea>
      </div>`).join("") + `<button class="cy" onclick="addItem(this,'libido')">＋新增</button>`;
  if (type === "chronotypes")
    return data.map((x,i)=>`<div class="card" data-i="${i}">
        <div class="row"><input value="${esc(x.name)}" data-f="name" placeholder="名稱" style="flex:1"><button class="del" onclick="delItem(this)">✕</button></div>
        <label>描述</label><input value="${esc(x.desc)}" data-f="desc">
        <label>被吵醒的反應</label><input value="${esc(x.wake_react)}" data-f="wake_react">
      </div>`).join("") + `<button class="cy" onclick="addItem(this,'chronotypes')">＋新增</button>`;
  if (type === "hobby_pool")
    return Object.entries(data).map(([vibe, hs])=>`<div class="card" data-vibe="${esc(vibe)}">
        <label>氣質桶「${esc(vibe)}」(一行一項)</label>
        <textarea class="lines" data-vibelines style="min-height:5em">${esc(hs.join("\n"))}</textarea>
      </div>`).join("");
  return "";
}

// 收集畫面 → POOLS(依 SCHEMA 反寫)
function collect() {
  const G = POOLS[curG];
  document.querySelectorAll("[data-sec]").forEach(sec => {
    const path = sec.dataset.sec, type = sec.dataset.type;
    if (type === "lines") {
      setPath(G, path, sec.querySelector("[data-lines]").value.split("\n").map(x=>x.trim()).filter(Boolean));
    } else if (type === "hobby_pool") {
      const out = {};
      sec.querySelectorAll("[data-vibe]").forEach(c => {
        out[c.dataset.vibe] = c.querySelector("[data-vibelines]").value.split("\n").map(x=>x.trim()).filter(Boolean);
      });
      setPath(G, path, out);
    } else {
      const items = [];
      sec.querySelectorAll("[data-i]").forEach(c => {
        const get = f => c.querySelector(`[data-f="${f}"]`);
        const val = f => get(f)?.value.trim();
        const chk = f => !!get(f)?.checked;
        let o = null;
        if (type === "graded") { if (val("text")) o = { text: val("text"), grade: val("grade") }; }
        else if (type === "flagged") { if (val("text")) { o = { text: val("text") }; if (chk("nsfw")) o.nsfw = true; } }
        else if (type === "traits") { if (val("name")) { o = { name: val("name"), rarity: val("rarity"), cat: val("cat") || val("name") }; if (chk("nsfw")) o.nsfw = true; } }
        else if (type === "occupations") {
          if (val("name")) {
            o = { name: val("name"), grade: val("grade"), life: val("life") || "" };
            if (val("outfit")) o.outfit = val("outfit");
            if (val("desc")) o.desc = val("desc");
            const sch = [0,1,2,3].map(j=>val("sch"+j)).filter(Boolean);
            if (sch.length === 4) o.sch = sch;
            if (chk("nsfw")) o.nsfw = true;
          }
        } else if (type === "archetypes") {
          if (val("name")) {
            o = { name: val("name"), tone: val("tone") || "",
              catchphrases: (val("catchphrases")||"").split(/[、,]/).map(x=>x.trim()).filter(Boolean),
              reactions: { "開心": val("re_開心")||"", "低落": val("re_低落")||"", "生氣": val("re_生氣")||"", "不安": val("re_不安")||"" },
              proactivity: +val("proactivity")||50, shyness: +val("shyness")||50,
              jealousy: +val("jealousy")||50, loyalty: +val("loyalty")||60,
              hobby_vibes: (val("hobby_vibes")||"").split(/[、,]/).map(x=>x.trim()).filter(Boolean) };
            if (chk("nsfw")) o.nsfw = true;
          }
        } else if (type === "libido") {
          if (val("name")) {
            o = { name: val("name"), grade: val("grade"), shyness_delta: +val("shyness_delta")||0, desc: val("desc")||"" };
            if (chk("nsfw")) o.nsfw = true;
          }
        } else if (type === "chronotypes") {
          if (val("name")) o = { name: val("name"), desc: val("desc")||"", wake_react: val("wake_react")||"" };
        }
        if (o) items.push(o);
      });
      setPath(G, path, items);
    }
  });
}

function delItem(btn) { btn.closest("[data-i]").remove(); }
function addItem(btn, type) {
  const sec = btn.closest("[data-sec]");
  collect();   // 先收目前輸入,避免重繪掉字
  const G = POOLS[curG], path = sec.dataset.sec;
  const arr = getPath(G, path) || [];
  const blank = { graded: {text:"",grade:"N"}, flagged: {text:""},
    traits: {name:"",rarity:"普通",cat:""},
    occupations: {name:"",grade:"R",life:"",outfit:""},
    archetypes: {name:"",tone:"",catchphrases:[],reactions:{},proactivity:50,shyness:50,jealousy:50,loyalty:60,hobby_vibes:[]},
    libido: {name:"",grade:"R",shyness_delta:0,desc:""},
    chronotypes: {name:"",desc:"",wake_react:""} }[type];
  arr.push(blank); setPath(G, path, arr);
  const open = [...document.querySelectorAll("details")].map(d=>d.open);
  render();
  [...document.querySelectorAll("details")].forEach((d,i)=>d.open=open[i]);
}

document.querySelectorAll("#g-tabs button").forEach(b => b.onclick = () => {
  if (curG === "male") { collectSummoners(); collectKinks(); } else collect();   // 保住當前分頁的編輯
  curG = b.dataset.g;
  document.querySelectorAll("#g-tabs button").forEach(x=>x.classList.toggle("on", x===b));
  render();
});

// ── 男子=召喚師編輯器(summoners.json)+ 性趣池(kinks.json) ──
let SUMMONERS = null, KINKS = null;
async function loadSummoners() {
  try { SUMMONERS = (await api("/content/summoners.json?ts=" + Date.now())).summoners || []; }
  catch { SUMMONERS = []; }
  try { KINKS = (await api("/content/kinks.json?ts=" + Date.now())).kinks || []; }
  catch { KINKS = []; }
}
function renderSummoners() {
  const el = document.getElementById("editor");
  el.innerHTML = `<section>
    <div class="mini" style="margin-bottom:.6em">召喚師池(現實裡覬覦你魅魔的男人)。展開編輯;約會傾向 = 他召喚妹子時「帶出門約會」的機率(其餘為召去身邊陪伴)。</div>
    <div id="su-list">${(SUMMONERS||[]).map((su,i)=>suCard(su,i)).join("") || `<div class="mini">目前沒有召喚師。</div>`}</div>
    <div class="row" style="margin-top:.7em"><button class="cy" onclick="addSummoner()">＋新增召喚師</button></div>
  </section>
  <section>
    <div class="mini" style="margin-bottom:.6em">性趣池(交配環節)。召喚師纏上魅魔時隨機抽 4~10 個給那對;每次交配挑一個,依起/承/合三步演出。<b style="color:#ff8fa3">這裡寫的就是 NSFW 演出內容</b>——魔法環的內/外射由核心處理,不用自己寫。</div>
    <div id="kink-list">${(KINKS||[]).map((k,i)=>kinkCard(k,i)).join("") || `<div class="mini">目前沒有性趣。</div>`}</div>
    <div class="row" style="margin-top:.7em"><button class="cy" onclick="addKink()">＋新增性趣</button></div>
  </section>`;
}
function kinkCard(k, i) {
  return `<div class="card" data-kink="${i}"><details>
    <summary>💗 <b>${esc(k.name||"(未命名)")}</b></summary>
    <label>性趣名稱</label><input value="${esc(k.name||"")}" data-kf="name">
    <label>起(開始:男開始、女回應)</label><textarea data-kf="qi">${esc(k.qi||"")}</textarea>
    <label>承(中間:男女互動)</label><textarea data-kf="cheng">${esc(k.cheng||"")}</textarea>
    <label>合(結束:高潮)</label><textarea data-kf="he">${esc(k.he||"")}</textarea>
    <div class="row" style="margin-top:.4em"><button class="del" onclick="delKink(${i})">刪除這個性趣</button></div>
  </details></div>`;
}
function collectKinks() {
  document.querySelectorAll("#kink-list [data-kink]").forEach(card => {
    const k = KINKS[+card.dataset.kink]; if (!k) return;
    card.querySelectorAll("[data-kf]").forEach(inp => { k[inp.dataset.kf] = inp.value.trim(); });
  });
}
function addKink() { collectSummoners(); collectKinks(); KINKS.push({ name:"", qi:"", cheng:"", he:"" }); renderSummoners();
  document.querySelector(`[data-kink="${KINKS.length-1}"] details`)?.setAttribute("open",""); }
function delKink(i) { if (!confirm(`刪除性趣「${KINKS[i]?.name||"(未命名)"}」?`)) return; collectSummoners(); collectKinks(); KINKS.splice(i,1); renderSummoners(); }
function suCard(su, i) {
  const spots = (su.spots||[]).map((sp,j)=>`
    <div class="row" style="gap:.4em;margin:.3em 0" data-spot="${i}:${j}">
      <input value="${esc(sp.name||"")}" data-sf="name" placeholder="地點名" style="flex:0 1 8em">
      <input value="${esc(sp.desc||"")}" data-sf="desc" placeholder="他在這個地點的互動習性(給 AI)" style="flex:1 1 12em">
      <button class="del" onclick="delSpot(${i},${j})">✕</button>
    </div>`).join("");
  return `<div class="card" data-su="${i}"><details>
    <summary>${su.emoji||"👤"} <b>${esc(su.name||"(未命名)")}</b> <span class="mini">(猥瑣 ${su.creep??1}・約會 ${Math.round((su.dateChance??.5)*100)}%)</span></summary>
    <div class="row" style="gap:.5em;margin-top:.5em">
      <span style="flex:1 1 8em"><label>名稱</label><input value="${esc(su.name||"")}" data-f="name"></span>
      <span style="flex:0 1 5em"><label>Emoji</label><input value="${esc(su.emoji||"")}" data-f="emoji"></span>
      <span style="flex:0 1 6em"><label>猥瑣 1~3</label><input type="number" min="1" max="3" value="${su.creep??1}" data-f="creep"></span>
      <span style="flex:0 1 7em"><label>約會傾向 %</label><input type="number" min="0" max="100" step="5" value="${Math.round((su.dateChance??.5)*100)}" data-f="dateChance"></span>
    </div>
    <label>一句話形象(給玩家看)</label><input value="${esc(su.desc||"")}" data-f="desc">
    <label>體態外貌(給 AI)</label><input value="${esc(su.body||"")}" data-f="body">
    <label>聊天方法/人設(給 AI 演他怎麼糾纏她)</label><textarea data-f="persona">${esc(su.persona||"")}</textarea>
    <label>愛去的地點(約會型事件優先選這裡)</label>
    ${spots || `<div class="mini">(還沒有地點——不填則隨機用遊戲內建約會地點)</div>`}
    <div class="row" style="margin-top:.4em">
      <button class="cy" style="font-size:.8em" onclick="addSpot(${i})">＋地點</button>
      <button class="del" onclick="delSummoner(${i})">刪除這個召喚師</button>
    </div>
  </details></div>`;
}
function collectSummoners() {
  document.querySelectorAll("#su-list [data-su]").forEach(card => {
    const i = +card.dataset.su, su = SUMMONERS[i];
    if (!su) return;
    card.querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f;
      if (f === "creep") su.creep = Math.max(1, Math.min(3, parseInt(inp.value)||1));
      else if (f === "dateChance") su.dateChance = Math.max(0, Math.min(100, parseInt(inp.value)||0))/100;
      else su[f] = inp.value.trim();
    });
    su.spots = [];
    card.querySelectorAll('[data-spot]').forEach(row => {
      const name = row.querySelector('[data-sf="name"]').value.trim();
      const desc = row.querySelector('[data-sf="desc"]').value.trim();
      if (name) su.spots.push({ name, desc });
    });
  });
}
function addSummoner() {
  collectSummoners(); collectKinks();
  SUMMONERS.push({ id: "su_"+Date.now().toString(36), name: "", emoji: "👤", creep: 1, dateChance: 0.5, desc: "", body: "", persona: "", spots: [] });
  renderSummoners();
  document.querySelector(`[data-su="${SUMMONERS.length-1}"] details`)?.setAttribute("open","");
}
function delSummoner(i) {
  if (!confirm(`刪除召喚師「${SUMMONERS[i]?.name||"(未命名)"}」?`)) return;
  collectSummoners(); collectKinks(); SUMMONERS.splice(i,1); renderSummoners();
}
function addSpot(i) { collectSummoners(); collectKinks(); (SUMMONERS[i].spots ??= []).push({name:"",desc:""}); renderSummoners();
  document.querySelector(`[data-su="${i}"] details`)?.setAttribute("open",""); }
function delSpot(i,j) { collectSummoners(); collectKinks(); SUMMONERS[i].spots.splice(j,1); renderSummoners();
  document.querySelector(`[data-su="${i}"] details`)?.setAttribute("open",""); }

async function saveAll() {
  try {
    if (curG === "male") {
      collectSummoners(); collectKinks();
      const bad = SUMMONERS.find(su => !su.name || !su.persona);
      if (bad) throw new Error("有召喚師缺「名稱」或「人設」");
      for (const su of SUMMONERS) su.spots = (su.spots||[]).filter(s => s.name);
      const badK = KINKS.find(k => !k.name);
      if (badK) throw new Error("有性趣缺「名稱」");
      await api("/api/summoners", "PUT", { summoners: SUMMONERS });
      await api("/api/kinks", "PUT", { kinks: KINKS });
      done("✓ 已寫回 summoners.json + kinks.json(遊戲重整後生效)");
    } else {
      collect();
      await api("/api/pools", "PUT", POOLS);
      done("✓ 已寫回 persona_pools.json(遊戲重整後生效)");
    }
  } catch (e) { fail(e.message); }
}
function done(m){ const s=document.getElementById("save-status"); s.textContent=m; s.className="status"; }
function fail(m){ const s=document.getElementById("save-status"); s.textContent="失敗:"+m; s.className="status err"; }

(async () => {
  POOLS = await api("/content/persona_pools.json?ts=" + Date.now());
  await loadSummoners();
  render();
})();
</script>
</body>
</html>
