<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>發現</title>
<meta name="theme-color" content="#16101f">
<link rel="manifest" href="widget.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=517">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=517">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="發現">
<style>
  /* 2026-11-06 使用者：框這麼大字卻這麼小 → 輸入框字變大、置中、點陣字（Fusion Pixel 12px 繁中，跟 App 同一套；字級取 12px 的整數倍才是一格一格的方塊） */
  @font-face { font-family: DiscoverPixel; src: url("fonts/fusion-pixel-12px-zh-hant.woff2") format("woff2"); font-display: swap; }
  :root {
    --bg: #141021;
    --panel: rgba(18, 12, 34, .78);
    --text: #9df3ff;
    --dim: rgba(157, 243, 255, .48);
    --cyan: #55ffe0;
    --bad: #ff5f7a;
    --ok: #6fe3e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, "Segoe UI", "Noto Sans TC", sans-serif;
  }
  body {
    min-height: 100dvh;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: .7em;
    background: var(--panel);
    padding: .7em;
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
  }
  #q, #mic { aspect-ratio: 1; width: 100%; min-width: 0; border-radius: 14px; }
  #q {
    background: color-mix(in srgb, var(--text) 8%, transparent);
    border: none;
    color: var(--text);
    font: 36px/1.25 DiscoverPixel, system-ui, sans-serif;
    text-align: center;
    padding: 12px;
    -webkit-font-smoothing: none; font-smooth: never;
    outline: none; resize: none;
  }
  #q.small { font-size: 24px; }
  #q::placeholder { color: var(--dim); }
  #q:disabled { opacity: .5; }
  #mic {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(157, 243, 255, .2);
    background: rgba(157, 243, 255, .1);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #mic:active { background: rgba(90, 58, 28, .35); }
  #mic .dot {
    width: 36%; aspect-ratio: 1; border-radius: 50%;
    background: #ff3b4f; box-shadow: 0 0 0 0 rgba(255, 59, 79, .5);
  }
  #mic.on { border-color: rgba(255, 77, 94, .6); }
  #mic.on .dot { animation: rec 1.1s ease-out infinite; }
  @keyframes rec { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 79, .55); } 100% { box-shadow: 0 0 0 1.1em rgba(255, 59, 79, 0); } }
  #st {
    margin: .7em .2em 0;
    min-height: 1.3em;
    font-size: .85em;
    color: var(--dim);
  }
  #st.ok { color: var(--ok); }
  #st.bad { color: var(--bad); }
  .hint {
    margin-top: 1.4em;
    font-size: .78em;
    color: var(--dim);
    display: none;
  }
  body:not(.standalone) .hint { display: block; }
</style>
</head>
<body>
  <!-- 2026-11-04：左邊語音（紅點），右邊輸入框，兩個都是正方形；沒有送出鈕，打完按鍵盤的送出（Enter）；說完話直接送 -->
  <form class="row" id="f" autocomplete="off">
    <button id="mic" type="button" aria-label="語音輸入" title="語音輸入"><span class="dot"></span></button>
    <textarea id="q" maxlength="80" placeholder="待辦…" enterkeyhint="send" rows="1" autofocus></textarea>
  </form>
  <p id="st"></p>
  <p class="hint">瀏覽器選單 → 加到主畫面，就能當小工具用。</p>
<script>
if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
  document.body.classList.add("standalone");
}
const f = document.getElementById("f");
const q = document.getElementById("q");
const st = document.getElementById("st");
function say(t, cls) {
  st.textContent = t || "";
  st.className = cls || "";
}
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = (q.value || "").trim();
  if (!text) { q.focus(); return; }
  q.disabled = true;
  say("送出中…");
  try {
    const r = await fetch("/api/quests/discover", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      say(j.detail || "送不出去", "bad");
      return;
    }
    q.value = "";
    fit();
    const gold = Number(j.gold) || 0;
    say(gold > 0 ? `已送進發現 +${gold} 金` : "已送進發現", "ok");
    try { navigator.vibrate?.(12); } catch {}
  } catch {
    say("連不上伺服器", "bad");
  } finally {
    q.disabled = false;
    q.focus();
  }
});
// 沒有送出鈕：鍵盤的送出（Enter）就送；輸入法選字中的 Enter 不算
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); f.requestSubmit(); }
});
setTimeout(() => q.focus(), 200);

// 2026-11-06 字置中：左右靠 text-align，上下照內容高度算上邊距（textarea 不能直接垂直置中）；字多到裝不下縮一級（36px → 24px）
const mirror = document.createElement("div");
function fit() {
  q.classList.remove("small");
  for (const small of [false, true]) {
    q.classList.toggle("small", small);
    const c = getComputedStyle(q);
    Object.assign(mirror.style, { position: "absolute", visibility: "hidden", left: "-9999px", top: "0", width: (q.clientWidth - 24) + "px",
      font: c.font, lineHeight: c.lineHeight, whiteSpace: "pre-wrap", wordBreak: "break-word", textAlign: "center" });
    mirror.textContent = (q.value || q.placeholder || "") + (q.value.endsWith("\n") ? " " : "");
    if (!mirror.isConnected) document.body.appendChild(mirror);
    const h = mirror.offsetHeight, room = q.clientHeight - 24;
    if (h <= room || small) { q.style.paddingTop = 12 + Math.max(0, Math.floor((room - h) / 2)) + "px"; break; }
  }
}
q.addEventListener("input", fit);
window.addEventListener("resize", fit);
document.fonts?.ready.then(fit);
fit();

// ---- 語音輸入（Web Speech API；Chrome 要 https 或 localhost 才能用麥克風）
const mic = document.getElementById("mic");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
mic.addEventListener("click", () => {
  if (rec) { rec.stop(); return; }
  if (!SR) { say("這個瀏覽器不能語音輸入，請用鍵盤上的麥克風", "bad"); return; }
  const base = (q.value || "").trim();
  let heard = "";
  rec = new SR();
  rec.lang = "zh-TW";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onresult = (e) => {
    heard = Array.from(e.results).map(r => r[0].transcript).join("");
    q.value = (base ? base + " " : "") + heard.trim();
    q.value = q.value.slice(0, 80);
    fit();
  };
  rec.onerror = (e) => {
    const m = { "not-allowed": "不能用麥克風（要允許麥克風；用 http 開的網頁瀏覽器不給，要 https）",
      "service-not-allowed": "不能用麥克風（要允許麥克風；用 http 開的網頁瀏覽器不給，要 https）",
      "no-speech": "沒聽到聲音，再按一次", "audio-capture": "找不到麥克風", "network": "語音辨識連不上網路" }[e.error];
    say(m || `語音輸入出錯（${e.error}）`, "bad");
  };
  rec.onend = () => {
    mic.classList.remove("on");
    rec = null;
    if (heard.trim()) f.requestSubmit();   // 說完直接送（送不出去字留在框裡）
    else if (st.textContent.startsWith("在聽")) say("沒聽清楚，再按一次", "bad");
  };
  mic.classList.add("on"); say("在聽…說出待辦（再按一下停）");
  try { rec.start(); } catch { rec = null; mic.classList.remove("on"); say("語音輸入開不起來", "bad"); }
});
</script>
</body>
</html>
