<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>魅魔萬事屋</title>
<meta name="theme-color" content="#16101f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="萬事屋">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- z1:看板娘層(有魅魔 = 剪影立繪;無魅魔 = 召喚書) -->
<div id="kanban">
  <div id="kanban-bubble" class="hidden"></div>
  <div id="kanban-zzz" class="hidden">Z z z…</div>
  <div id="book">
    <svg viewBox="0 0 48 40" width="192" height="160" shape-rendering="crispEdges">
      <rect x="6"  y="4"  width="36" height="32" fill="#3b2158"/>
      <rect x="8"  y="6"  width="32" height="28" fill="#4b2a70"/>
      <rect x="22" y="4"  width="4"  height="32" fill="#2a1440"/>
      <rect x="6"  y="34" width="36" height="2"  fill="#241333"/>
      <path d="M24 12 l3 6 6 1 -4 4 1 6 -6 -3 -6 3 1 -6 -4 -4 6 -1 z" fill="#ff4fd8"/>
      <rect x="10" y="10" width="2" height="2" fill="#6fe3e1"/>
      <rect x="36" y="26" width="2" height="2" fill="#6fe3e1"/>
    </svg>
    <div id="magic-circle"></div>
  </div>
  <div id="kanban-girl" class="hidden"></div>
</div>

<!-- z3:頂部 HUD -->
<header id="hud">
  <span id="hud-gold">⟡ 0</span>
  <span id="hud-debt" class="hidden">負債中</span>
  <button id="hud-need" class="hidden">● <span>0</span></button>
  <span id="hud-sleep" class="hidden">🌙 夢境時間</span>
</header>

<!-- z2:功能面板(四分頁滑動) -->
<main id="track-wrap">
  <div id="track">

    <section class="page" id="page-quests">
      <div class="panel">
        <h2>執行中 <span id="exec-count" class="dim"></span></h2>
        <div id="list-exec" class="qlist"></div>
      </div>
      <div class="panel sub">
        <h2>已承接</h2>
        <div id="list-accepted" class="qlist"></div>
      </div>
      <div class="panel sub">
        <h2>發現</h2>
        <div id="list-found" class="qlist"></div>
      </div>
      <div id="quest-input-row">
        <input id="quest-input" type="text" maxlength="80" placeholder="輸入現實中的待辦…(Enter 送出)">
        <button id="quest-add">發現</button>
      </div>
    </section>

    <section class="page" id="page-shop">
      <div class="panel">
        <h2>祭品商店</h2>
        <p id="merchant-line" class="dim small"></p>
        <div id="shop-stock"></div>
      </div>
      <div class="panel sub">
        <h2>地牢 <span id="dungeon-count" class="dim"></span></h2>
        <div id="dungeon-list" class="small"></div>
      </div>
    </section>

    <section class="page" id="page-succubi">
      <div id="succubi-home">
        <div class="panel" id="roster-panel">
          <h2>魅魔名冊</h2>
          <div id="roster"></div>
        </div>
        <div class="panel sub center-note" id="summon-block">
          <h2>召喚</h2>
          <p class="dim small" id="summon-hint"></p>
          <div id="summon-counts"></div>
        </div>
      </div>
      <div id="succubus-detail" class="hidden"></div>
      <div id="chat-view" class="hidden">
        <div class="chat-top">
          <button class="back-btn" id="chat-back">‹ 結束對話</button>
          <span id="chat-title" class="dim small"></span>
          <button class="back-btn" id="chat-log-btn">紀錄</button>
        </div>
        <div id="chat-spacer"></div>
        <div id="vn-box">
          <div id="vn-nameline">
            <span id="vn-name"></span>
            <span id="vn-typing" class="hidden"><i></i><i></i><i></i></span>
          </div>
          <div id="vn-text"></div>
          <span id="vn-cursor" class="hidden">▼</span>
        </div>
        <div id="chat-input-row">
          <input id="chat-input" type="text" maxlength="300" placeholder="說點什麼…(Enter 送出)">
          <button id="chat-send">送出</button>
        </div>
        <div id="chat-backlog" class="hidden"><div id="chat-msgs"></div></div>
      </div>
    </section>

    <section class="page" id="page-settings">
      <div class="panel">
        <h2>設定</h2>
        <div class="setting-row"><label>玩家稱呼</label><input id="set-player" type="text" maxlength="12" placeholder="主人"></div>
        <div class="setting-row"><label>睡眠時段</label>
          <span><input id="set-sleep-start" type="time"> ~ <input id="set-sleep-end" type="time"></span>
        </div>
        <div class="setting-row"><label>看板娘</label><select id="set-kanban"></select></div>
        <div class="setting-row"><label>配色</label><select id="set-theme"></select></div>
      </div>
      <div class="panel sub">
        <h2>AI(Ollama)</h2>
        <div class="setting-row"><label>端點</label><input id="set-ollama" type="text" class="wide" placeholder="http://<主機>:11434"></div>
        <div class="setting-row"><label>模型</label><input id="set-model" type="text" class="wide" list="model-list" placeholder="(留空 = 罐頭模式)"><datalist id="model-list"></datalist></div>
        <div class="setting-row"><label>內容分級</label><select id="set-rating"><option value="sfw">SFW</option><option value="nsfw">NSFW(依內容模組)</option></select></div>
        <div class="btn-row"><button id="btn-llm-test">測試連線</button><span id="llm-test-result" class="dim small"></span></div>
      </div>
      <div class="panel sub">
        <h2>存檔</h2>
        <div class="setting-row"><label>伺服器</label><span id="set-srv" class="dim">—</span></div>
        <div class="setting-row"><label>存檔版本</label><span id="set-ver" class="dim">—</span></div>
        <div class="btn-row">
          <button id="btn-export">匯出</button>
          <button id="btn-import">匯入</button>
          <button id="btn-reset" class="danger-btn">重置</button>
        </div>
        <input id="import-file" type="file" accept="application/json" class="hidden">
      </div>
      <div class="panel sub">
        <h2>記錄</h2>
        <div id="log-list" class="dim small"></div>
      </div>
    </section>

  </div>
</main>

<!-- z3:底部分頁列 -->
<nav id="tabs">
  <button data-tab="0" class="active">委託</button>
  <button data-tab="1">商店</button>
  <button data-tab="2">魅魔</button>
  <button data-tab="3">設定</button>
</nav>

<!-- 召喚演出 -->
<div id="summon-overlay" class="hidden"></div>

<!-- 斷線重連畫面 -->
<div id="conn-overlay" class="hidden">
  <div class="conn-box">
    <div>連線伺服器中…</div>
    <button id="conn-retry">立刻重試</button>
  </div>
</div>

<div id="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
