<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魅魔萬事屋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #16101f;
    color: #d8cfe8;
    font-family: "Cubic 11", "Fusion Pixel", monospace;
    display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(ellipse at 50% 120%, #2a1440 0%, #16101f 70%);
  }
  /* CRT 掃描線 */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.18) 2px 4px);
  }
  .panel {
    background: rgba(20, 12, 32, .68);
    padding: 2.5rem 3rem; max-width: 30rem; width: 90%;
    text-align: center;
  }
  h1 { color: #ff4fd8; font-size: 1.6rem; letter-spacing: .3em; margin-bottom: .4rem; }
  .sub { color: #6fe3e1; font-size: .8rem; letter-spacing: .2em; margin-bottom: 2rem; }
  .row {
    display: flex; justify-content: space-between; font-size: .85rem;
    padding: .55rem .2rem; border-bottom: 1px solid rgba(216,207,232,.08);
  }
  .row:last-of-type { border-bottom: none; }
  .val { color: #6fe3e1; }
  .val.err { color: #ff5f7a; }
  .hint { margin-top: 2rem; font-size: .7rem; color: rgba(216,207,232,.45); letter-spacing: .1em; }
</style>
</head>
<body>
  <div class="panel">
    <h1>魅魔萬事屋</h1>
    <div class="sub">— M0 伺服器骨架 —</div>
    <div class="row"><span>伺服器</span><span class="val" id="srv">連線中…</span></div>
    <div class="row"><span>存檔版本</span><span class="val" id="ver">—</span></div>
    <div class="hint">遊戲本體施工中。召喚書還沒送到。</div>
  </div>
<script>
(async () => {
  const srv = document.getElementById("srv");
  const ver = document.getElementById("ver");
  try {
    const h = await fetch("/api/health").then(r => r.json());
    srv.textContent = h.ok ? "OK" : "異常";
    const s = await fetch("/api/save").then(r => r.json());
    ver.textContent = s.version === 0 ? "無存檔(新的開始)" : "v" + s.version;
  } catch (e) {
    srv.textContent = "連線失敗";
    srv.classList.add("err");
  }
})();
</script>
</body>
</html>
