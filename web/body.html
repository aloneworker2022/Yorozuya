<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>虛擬設計・胸部 | 魅魔萬事屋</title>
<meta name="theme-color" content="#16101f">
<style>
:root {
  --bg: #141021; --glow: #251440;
  --panel: rgba(18, 12, 34, .72); --panel2: rgba(18, 12, 34, .5);
  --text: #9df3ff; --dim: rgba(157, 243, 255, .5);
  --line: rgba(157, 243, 255, .14); --accent: #ff4fd8; --cyan: #55ffe0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 120%, var(--glow) 0%, var(--bg) 72%);
  color: var(--text);
  text-shadow: 0 0 6px color-mix(in srgb, currentColor 32%, transparent);
  font-family: "Cubic 11", "Fusion Pixel", ui-monospace, monospace;
  font-size: 14px;
  image-rendering: pixelated;
  min-height: 100%;
  padding: 14px 12px 40px;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 99;
  background:
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.14) 2px 4px),
    radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.34) 100%);
}
.wrap { max-width: 780px; margin: 0 auto; }
header.top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 14px; }
header.top h1 { font-size: 17px; letter-spacing: 1px; color: var(--accent); }
header.top .sub { color: var(--dim); font-size: 12px; }
header.top a.home { margin-left: auto; color: var(--cyan); text-decoration: none;
  border: 1px solid var(--line); padding: 3px 8px; border-radius: 3px; }
.stage-box { position: relative; margin: 0 auto 14px; width: fit-content;
  padding: 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel2); box-shadow: inset 0 0 40px rgba(0,0,0,.4); }
.stage-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
canvas { display: block; image-rendering: pixelated; }
.stage-cap { text-align: center; color: var(--dim); font-size: 11px; margin-top: 4px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px; margin-bottom: 12px; }
.panel h2 { font-size: 13px; color: var(--cyan); margin-bottom: 10px; letter-spacing: 1px; }
.row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
.row label { flex: 0 0 60px; color: var(--dim); font-size: 12px; }
.row input[type=range] { flex: 1; accent-color: var(--accent); height: 4px; }
.row .val { flex: 0 0 44px; text-align: right; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-family: inherit; font-size: 12px; cursor: pointer; color: var(--text);
  background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 10px; text-shadow: inherit; }
.chips button.on { border-color: var(--accent); color: var(--accent);
  box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent); }
.chips button .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(255,255,255,.3); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { font-family: inherit; font-size: 13px; cursor: pointer;
  color: var(--bg); background: var(--accent); border: none; border-radius: 4px;
  padding: 8px 14px; text-shadow: none; font-weight: bold; }
.actions button.ghost { background: var(--panel2); color: var(--cyan);
  border: 1px solid var(--line); text-shadow: inherit; }
.note { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>虛擬設計台・胸部</h1>
    <span class="sub">純點陣 2D 貼圖 · 七型胸型型錄</span>
    <a class="home" href="/">← 回萬事屋</a>
  </header>

  <div class="stage-box">
    <div class="stage-row">
      <div><canvas id="front" width="160" height="200"></canvas><div class="stage-cap">正面</div></div>
      <div><canvas id="side" width="110" height="200"></canvas><div class="stage-cap">側面</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>◆ 胸型(型錄)</h2>
    <div class="chips" id="types"></div>
    <div class="two-col">
      <div class="row" style="margin-top:10px"><label>大小</label><input id="size" type="range" min="60" max="140" value="100"><span class="val" id="size-v"></span></div>
      <div class="row"><label>間距</label><input id="gap" type="range" min="70" max="130" value="100"><span class="val" id="gap-v"></span></div>
    </div>
  </div>

  <div class="panel">
    <h2>◆ 膚色 / 輸出</h2>
    <div class="row" style="margin-top:0"><label>膚色</label><div class="chips" id="skin"></div></div>
    <div class="actions" style="margin-top:10px">
      <button id="export">匯出 PNG</button>
      <button id="reset" class="ghost">重設</button>
    </div>
    <div class="note">
      純 2D 點陣貼圖(輪廓線+平塗+賽璐璐影),無 3D 運算。
      七種胸型對照型錄:側面輪廓為各型手調線稿,正面同步顯示下乳弧線/乳位/外擴。
      匯出 PNG 可作 ComfyUI / 立繪構圖底稿。
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
// ---- 畫布 ----
const F = document.getElementById('front'), S = document.getElementById('side');
const fctx = F.getContext('2d'), sctx = S.getContext('2d');
for (const c of [F, S]){ c.style.width = c.width*2+'px'; c.style.height = c.height*2+'px'; }

// ---- 調色盤(5 階賽璐璐:深線/影/主色/亮/高光)----
const SKINS = {
  fair: ['#7a4a3a','#d99b72','#efb98d','#f9d3ac','#ffe9c9'],
  tan:  ['#6b452c','#bd8a58','#d3a672','#e6c18c','#f4d9a8'],
  pink: ['#8a5058','#e2a294','#f4bfa9','#ffd8bf','#ffe9d5'],
  deep: ['#4a2c1c','#8a6242','#a37c54','#bd9668','#d3ae80'],
};
const P = { type: 'hemi', size: 1, gap: 1, skin: 'fair' };

// ---- 七型定義 ----
// side:[t,depth] 胸區側面輪廓折線(t=0 上緣→1 下緣,depth 0..1)
// front:{ry 下弧扁率, drop 下弧中心下移, nip:[dx,dy] 乳位偏移, bulge 外擴, top 上弧提示}
const TYPES = {
  plate: {name:'皿型',  front:{ry:.45, drop:-.15, nip:[0,-.2], bulge:.15, top:.3},
    side:[[0,.05],[.25,.12],[.5,.30],[.68,.34],[.85,.22],[1,.06]]},
  tri:   {name:'三角型', front:{ry:.55, drop:.05, nip:[.05,.15], bulge:.3, top:.4},
    side:[[0,.04],[.3,.14],[.55,.34],[.75,.56],[.82,.50],[.92,.20],[1,.05]]},
  hemi:  {name:'半球型', front:{ry:.62, drop:0, nip:[.05,-.1], bulge:.5, top:.6},
    side:[[0,.05],[.15,.22],[.35,.52],[.5,.62],[.65,.52],[.85,.24],[1,.05]]},
  bowl:  {name:'碗型',  front:{ry:.58, drop:.05, nip:[.05,0], bulge:.45, top:.5},
    side:[[0,.05],[.2,.18],[.45,.44],[.62,.56],[.78,.46],[.9,.2],[1,.05]]},
  cone:  {name:'圓錐型', front:{ry:.55, drop:.05, nip:[.08,.05], bulge:.35, top:.5},
    side:[[0,.04],[.28,.2],[.5,.44],[.62,.60],[.72,.44],[.88,.16],[1,.04]]},
  bell:  {name:'釣鐘型', front:{ry:.62, drop:.18, nip:[.06,.2], bulge:.55, top:.45},
    side:[[0,.04],[.3,.12],[.55,.3],[.72,.55],[.85,.58],[.95,.3],[1,.06]]},
  ptotic:{name:'下垂型', front:{ry:.6, drop:.32, nip:[.1,.38], bulge:.5, top:.35},
    side:[[0,.04],[.35,.10],[.6,.24],[.78,.48],[.9,.55],[.97,.35],[1,.08]]},
};

// ---- 像素工具 ----
function px(img, W, x, y, col){
  x|=0; y|=0;
  if (x<0||y<0||x>=W||y>=img.height) return;
  const p=(y*W+x)*4, c=col;
  img.data[p]=c[0]; img.data[p+1]=c[1]; img.data[p+2]=c[2]; img.data[p+3]=255;
}
function hx(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function line(img,W,x0,y0,x1,y1,col){          // Bresenham
  x0|=0;y0|=0;x1|=0;y1|=0;
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let e=dx+dy;
  for(;;){ px(img,W,x0,y0,col);
    if(x0===x1&&y0===y1)break;
    const e2=2*e;
    if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} }
}
function arc(img,W,cx,cy,rx,ry,a0,a1,col){     // 橢圓弧(取樣描點)
  const n=Math.max(12,(rx+ry)|0);
  let lx,ly;
  for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n;
    const x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    if(i)line(img,W,lx,ly,x,y,col);
    lx=x;ly=y;
  }
}

// ---- 軀幹輪廓(半寬控制點,沿用已定稿的骨架)----
const PROFILE = [[-1,.155],[-.96,.19],[-.84,.46],[-.72,.66],[-.66,.68],[-.56,.60],
  [-.34,.58],[.02,.57],[.36,.485],[.7,.49],[.92,.50]];
function halfW(ny){
  if (ny<=PROFILE[0][0]) return PROFILE[0][1];
  for (let i=1;i<PROFILE.length;i++){
    if (ny<=PROFILE[i][0]){
      const [y0,w0]=PROFILE[i-1],[y1,w1]=PROFILE[i];
      let t=(ny-y0)/(y1-y0); t=t*t*(3-2*t);
      return w0+(w1-w0)*t;
    }
  }
  return PROFILE[PROFILE.length-1][1];
}

// ---- 正面 ----
function renderFront(){
  const W=F.width,H=F.height;
  const img=fctx.createImageData(W,H);
  const C=SKINS[P.skin].map(hx);
  const T=TYPES[P.type], fr=T.front, k=P.size;
  const midX=W/2, sc=W/2*0.98;
  const ax=26*P.gap*(1+fr.bulge*0.25)*Math.min(1.15,k);   // 乳軸距
  const rx=20*k, ry=rx*fr.ry;
  const fy=92+fr.drop*34*k+ (k-1)*10;                     // 下弧中心列
  const bTop=fy-ry*2.1, bBot=fy+ry;                       // 胸區行範圍
  // 軀幹填色(含胸區外擴)
  for(let y=0;y<H;y++){
    const ny=(y-H/2)/(H/2);
    if(ny>0.92) continue;
    let hw=halfW(ny)*sc;
    if(y>bTop&&y<bBot){                                    // 外擴:剪影加寬
      const u=(y-bTop)/(bBot-bTop);
      hw+=fr.bulge*10*k*Math.sin(Math.PI*u);
    }
    const x0=Math.round(midX-hw), x1=Math.round(midX+hw);
    for(let x=x0;x<=x1;x++){
      let c=C[2];
      if(x<=x0+1||x>=x1-1) c=C[0];                         // 輪廓線
      else if(x>=x1-4) c=C[1];                             // 右側賽璐璐影
      else if(x<=x0+4) c=C[3];                             // 左側亮
      px(img,W,x,y,c);
    }
  }
  // 鎖骨
  line(img,W,midX-6,34,midX-24,30,C[1]); line(img,W,midX+6,34,midX+24,30,C[1]);
  // 肚臍
  px(img,W,midX,180,C[0]); px(img,W,midX,181,C[0]);
  for(const s of [-1,1]){
    const cx=midX+s*ax;
    // 下乳弧(U 形)
    arc(img,W,cx,fy,rx,ry,Math.PI*0.08,Math.PI*0.92,C[0]);
    arc(img,W,cx,fy-1,rx-1,ry-1,Math.PI*0.15,Math.PI*0.85,C[1]);  // 弧上影
    // 上緣提示弧(內上斜)
    arc(img,W,cx+s*rx*0.1,fy-ry*0.6,rx*0.95,ry*2.0*fr.top+ry, Math.PI*(s<0?1.05:1.6), Math.PI*(s<0?1.4:1.95), C[1]);
    // 乳頭
    const nx=cx+s*fr.nip[0]*rx, nyy=fy-ry*0.9+fr.nip[1]*ry*2.2;
    px(img,W,nx,nyy,C[0]); px(img,W,nx+1,nyy,C[0]); px(img,W,nx,nyy+1,C[1]); px(img,W,nx+1,nyy+1,C[1]);
    // 高光點
    px(img,W,cx-s*rx*0.35,fy-ry*1.5,C[4]); px(img,W,cx-s*rx*0.35+1,fy-ry*1.5,C[4]);
  }
  fctx.putImageData(img,0,0);
}

// ---- 側面(型錄線稿)----
function renderSide(){
  const W=S.width,H=S.height;
  const img=sctx.createImageData(W,H);
  const C=SKINS[P.skin].map(hx);
  const T=TYPES[P.type], k=P.size;
  const x0=16;                     // 胸壁基準
  const zTop=52, zBot=Math.min(178, 130+(P.type==='ptotic'?14:0)+ (k-1)*30); // 胸區行
  const depth=58*k;
  // 背/頸/腹基準線
  line(img,S.width,x0-2,6,x0-2,H-8,C[1]);
  // 上胸斜線(頸→胸區)
  line(img,W,x0+14,6,x0+10,26,C[0]);
  line(img,W,x0+10,26,x0+4,zTop,C[0]);
  // 胸區折線
  let lx=x0+4, ly=zTop;
  for(const [t,d] of T.side){
    const y=zTop+(zBot-zTop)*t, x=x0+4+d*depth;
    line(img,W,lx,ly,x,y,C[0]);
    lx=x; ly=y;
  }
  // 乳頭(最深點)
  let mi=0; T.side.forEach((p,i)=>{ if(p[1]>T.side[mi][1]) mi=i; });
  const [mt,md]=T.side[mi];
  const nxp=x0+4+md*depth+1, nyp=zTop+(zBot-zTop)*mt;
  px(img,W,nxp,nyp,C[0]); px(img,W,nxp+1,nyp,C[0]);
  // 下腹線(胸區→肚臍)
  line(img,W,lx,ly,x0+8,H-30,C[0]);
  line(img,W,x0+8,H-30,x0+6,H-8,C[0]);
  sctx.putImageData(img,0,0);
}

function render(){ renderFront(); renderSide(); }

// ---- UI ----
const $=s=>document.querySelector(s);
const tw=$('#types');
Object.entries(TYPES).forEach(([key,t])=>{
  const b=document.createElement('button');
  b.textContent=t.name;
  if(key===P.type)b.classList.add('on');
  b.onclick=()=>{P.type=key;[...tw.children].forEach(c=>c.classList.toggle('on',c===b));render();};
  tw.appendChild(b);
});
const skinNames={fair:'白皙',tan:'小麥',pink:'櫻粉',deep:'深棕'};
const sw=$('#skin');
Object.keys(SKINS).forEach(key=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="sw" style="background:${SKINS[key][3]}"></span>${skinNames[key]}`;
  if(key===P.skin)b.classList.add('on');
  b.onclick=()=>{P.skin=key;[...sw.children].forEach(c=>c.classList.toggle('on',c===b));render();};
  sw.appendChild(b);
});
function bind(id,key){
  const el=$('#'+id),v=$('#'+id+'-v');
  const u=()=>{P[key]=+el.value/100;v.textContent=el.value+'%';render();};
  el.addEventListener('input',u);u();
}
bind('size','size'); bind('gap','gap');
$('#export').onclick=()=>{
  const off=document.createElement('canvas');
  off.width=(F.width+S.width+10)*4; off.height=F.height*4;
  const o=off.getContext('2d'); o.imageSmoothingEnabled=false;
  o.drawImage(F,0,0,F.width*4,F.height*4);
  o.drawImage(S,(F.width+10)*4,0,S.width*4,S.height*4);
  const a=document.createElement('a');
  a.download='body-design.png'; a.href=off.toDataURL('image/png'); a.click();
};
$('#reset').onclick=()=>location.reload();
render();
})();
</script>
</body>
</html>
