<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>胸部 128×128 | 魅魔萬事屋</title>
<meta name="theme-color" content="#16101f">
<style>
:root{ --bg:#141021; --glow:#251440; --panel:rgba(18,12,34,.72); --panel2:rgba(18,12,34,.5);
  --text:#9df3ff; --dim:rgba(157,243,255,.5); --line:rgba(157,243,255,.14); --accent:#ff4fd8; --cyan:#55ffe0; }
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{ background:var(--bg); background-image:radial-gradient(ellipse at 50% 120%,var(--glow) 0%,var(--bg) 72%);
  color:var(--text); text-shadow:0 0 6px color-mix(in srgb,currentColor 32%,transparent);
  font-family:"Cubic 11","Fusion Pixel",ui-monospace,monospace; font-size:14px;
  image-rendering:pixelated; min-height:100%; padding:14px 12px 40px; }
body::after{ content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 4px),
  radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.34) 100%); }
.wrap{max-width:780px;margin:0 auto;}
header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;}
header.top h1{font-size:17px;letter-spacing:1px;color:var(--accent);}
header.top .sub{color:var(--dim);font-size:12px;}
header.top a.home{margin-left:auto;color:var(--cyan);text-decoration:none;border:1px solid var(--line);padding:3px 8px;border-radius:3px;}
.stage-box{position:relative;margin:0 auto 14px;width:fit-content;padding:12px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel2);box-shadow:inset 0 0 40px rgba(0,0,0,.4);}
.stage-box .grid{position:absolute;inset:12px;pointer-events:none;opacity:.14;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;}
canvas{display:block;image-rendering:pixelated;position:relative;z-index:1;}
.stage-cap{text-align:center;color:var(--dim);font-size:11px;margin-top:6px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px;}
.panel h2{font-size:13px;color:var(--cyan);margin-bottom:10px;letter-spacing:1px;}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;}
.row label{flex:0 0 60px;color:var(--dim);font-size:12px;}
.row input[type=range]{flex:1;accent-color:var(--accent);height:4px;}
.row .val{flex:0 0 44px;text-align:right;font-size:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips button{font-family:inherit;font-size:12px;cursor:pointer;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:4px;padding:5px 10px;text-shadow:inherit;}
.chips button.on{border-color:var(--accent);color:var(--accent);}
.chips button .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.3);}
.actions{display:flex;gap:8px;flex-wrap:wrap;}
.actions button{font-family:inherit;font-size:13px;cursor:pointer;color:var(--bg);background:var(--accent);
  border:none;border-radius:4px;padding:8px 14px;text-shadow:none;font-weight:bold;}
.actions button.ghost{background:var(--panel2);color:var(--cyan);border:1px solid var(--line);text-shadow:inherit;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
@media(max-width:560px){.two-col{grid-template-columns:1fr;}}
.note{color:var(--dim);font-size:11px;line-height:1.6;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>胸部 128×128</h1>
    <span class="sub">點陣立繪素材 · 正面 / 側面</span>
    <a class="home" href="/">← 回萬事屋</a>
  </header>

  <div class="stage-box">
    <div class="grid"></div>
    <canvas id="cv" width="128" height="128"></canvas>
    <div class="stage-cap">128 × 128 · 像素放大顯示</div>
  </div>

  <div class="panel">
    <h2>◆ 視角 / 體型</h2>
    <div class="row" style="margin-top:0"><label>視角</label>
      <div class="chips" id="view">
        <button data-v="front" class="on">正面</button>
        <button data-v="side">側面</button>
      </div>
    </div>
    <div class="two-col">
      <div class="row"><label>大小</label><input id="size" type="range" min="60" max="150" value="100"><span class="val" id="size-v"></span></div>
      <div class="row"><label>下垂</label><input id="droop" type="range" min="0" max="100" value="35"><span class="val" id="droop-v"></span></div>
      <div class="row"><label>間距</label><input id="gap" type="range" min="70" max="130" value="100"><span class="val" id="gap-v"></span></div>
      <div class="row"><label>乳頭</label><input id="nsz" type="range" min="60" max="150" value="100"><span class="val" id="nsz-v"></span></div>
    </div>
  </div>

  <div class="panel">
    <h2>◆ 膚色 / 輸出</h2>
    <div class="row" style="margin-top:0"><label>膚色</label><div class="chips" id="skin"></div></div>
    <div class="actions" style="margin-top:10px">
      <button id="export">匯出 128×128 PNG</button>
      <button id="reset" class="ghost">重設</button>
    </div>
    <div class="note">
      依手繪參考的正面與側面比例做的 128×128 胸部素材:柔軟水滴形、上緣緩坡融入胸口、
      飽滿下乳弧、乳溝、乳暈乳頭朝下外。純點陣賽璐璐著色,可直接作 ComfyUI/立繪底稿。
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const cv=document.getElementById('cv'), W=cv.width, H=cv.height;
const ctx=cv.getContext('2d');
cv.style.width=(W*3)+'px'; cv.style.height=(H*3)+'px';
const img=ctx.createImageData(W,H), buf=img.data;

const SKINS={
  porcelain:['#7c4f52','#c98d84','#e6b6a8','#f6d6c6','#fff0e6'],
  fair:['#7a4a3a','#b9795f','#d99b78','#efba90','#ffe0c2'],
  tan:['#6b452c','#9c6f49','#c08d5e','#d8ab7a','#efcc9c'],
  pink:['#8a5058','#c0838a','#e0a6a0','#f4c6b8','#ffe0d2'],
  deep:['#3f2418','#6a4530','#8a6242','#a87c54','#c89a70'],
};
const NIPC={ porcelain:['#b06a70','#d99490'], fair:['#a85f57','#cf8b7f'], tan:['#8a5a44','#b07a5e'],
  pink:['#b06068','#dc9090'], deep:['#4a2c20','#6e4636'] };

const P={ view:'front', size:1, droop:.35, gap:1, nsz:1, skin:'fair' };

// ---- 像素工具 ----
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function set(x,y,c){ x|=0;y|=0; if(x<0||y<0||x>=W||y>=H)return; const p=(y*W+x)*4;
  buf[p]=c[0];buf[p+1]=c[1];buf[p+2]=c[2];buf[p+3]=255; }
function smooth(e0,e1,x){ const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0))); return t*t*(3-2*t); }

// ===== 正面 =====
// 每邊乳房 = 水滴團塊,上緣緩坡融入胸口、下緣飽滿弧、乳溝、乳暈
function renderFront(){
  const C=SKINS[P.skin].map(hx), NP=NIPC[P.skin].map(hx);
  const k=P.size, S=P.droop;
  const cy=54+S*10;                       // 乳房中心高度(垂→下移)
  const rx=22*k*(0.9+0.1*P.gap), ry=(24+S*10)*k;    // 半寬/半高(垂→拉長)
  const gap=28*P.gap;                     // 乳心距中線
  const tilt=(20+8*(1-S))*Math.PI/180;    // 外傾角(參考:胸沿肋廓約 45°外;正面投影 ~20-28°)
  // 依側計算旋轉後的局部座標(團塊外傾,尾部朝腋下)
  function local(x,y,s){
    const cxa=64+s*gap, px=x-cxa, py=y-cy, th=s*tilt;
    const ca=Math.cos(th), sa=Math.sin(th);
    let lx=(px*ca+py*sa)/rx, ly=(-px*sa+py*ca)/ry;
    let lyr=ly; if(ly<0) lyr=ly*1.2;      // 上緣壓扁 → 往腋下拉出尾部(水滴)
    return {cxa,px,py,lx,ly, d:Math.hypot(lx,lyr)};
  }
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const nx=x-64;
      let bw=52+6*smooth(0,40,y)-3*smooth(40,70,y)-14*smooth(70,120,y); // 軀幹半寬
      // 取較近的乳房
      let bs=0, B=null;
      for(const s of [-1,1]){ const L=local(x,y,s); if(!B||L.d<B.d){ B=L; bs=s; } }
      const inTorso = Math.abs(nx)<bw || B.d<1;
      if(!inTorso){ buf[(y*W+x)*4+3]=0; continue; }

      const s=bs, cxa=B.cxa;
      // 光為全域(左上前),用螢幕座標算受光,不用旋轉座標
      const ux=(x-cxa)/rx, uy=(y-cy)/ry;
      let v;
      if(B.d<1){
        v = 0.62 - uy*0.44 - (ux*s)*0.12;              // 上亮下暗、內側略亮
        v -= 0.24*smooth(0.32,0.92, uy);               // 下半核心陰影(乳房下側)
        if(B.d>0.80 && uy>0.45) v += 0.12;             // 反光:核心陰影下緣一道亮邊
        // 乳溝:靠中線處柔和加深(抖色、不畫硬線)
        const cl=(gap-Math.abs(nx))/ (gap*0.9);
        if(nx*s>0 && cl>0 && Math.abs(uy)<0.9){ if(((x+y)&1)===0) v-=0.16*cl; }
      } else {
        v = 0.52 - Math.abs(nx)/bw*0.40;               // 軀幹柱狀
        if(nx>bw*0.35) v-=0.10;
        // 乳房下方的投影(cast shadow):落在肋廓上,貼著下緣一彎
        if(B.d<1.30 && uy>0.45){ v -= 0.20*(1.30-B.d)/0.30; if(((x+y)&1)) v+=0.05; }
      }
      let shade=Math.max(0,Math.min(4,Math.round(v*4)));
      let col=C[shade];

      // 乳暈 + 乳頭:位於乳房前下、朝外下(參考:乳頭外傾約 45°)
      const npx=cxa+s*rx*(0.26+0.10*S), npy=cy+ry*(0.30+0.34*S);
      const nAr=6.2*P.nsz, nNip=2.3*P.nsz;
      const dn=Math.hypot((x-npx)/1.0,(y-npy)/0.9);
      if(B.d<1.02){
        if(dn<nNip) col=NP[0];                          // 乳頭
        else if(dn<nAr){ // 乳暈:向皮膚柔和過渡(邊緣抖色,不畫硬圈)
          if(dn<nAr-1.4 || ((x+y)&1)===0) col=NP[1];
        }
      }
      set(x,y,col);
    }
  }
}

// ===== 側面(依手繪 S 曲線:胸壁→乳前凸→下乳內收→腰)=====
function renderSide(){
  const C=SKINS[P.skin].map(hx), NP=NIPC[P.skin].map(hx);
  const k=P.size, S=P.droop;
  const backX=88;                         // 背/軀幹後緣
  const chestX=44;                        // 胸壁前緣基準
  const cy=52+S*12;                        // 乳凸中心
  const proj=30*k;                        // 乳前凸量
  const ry=(26+S*12)*k;
  const nipy=cy+ry*(0.2+0.35*S);
  for(let y=0;y<H;y++){
    // 前緣 x(越小越前):乳房凸出
    let ly=(y-cy)/ry; if(ly>0) ly/=(1+0.6*S);
    let front=chestX;
    if(Math.abs(ly)<1){ front=chestX - proj*Math.sqrt(1-ly*ly); }
    // 軀幹前緣基線(上胸略後、腰內收)
    front -= 2*smooth(0,cy,y);
    const waist = 6*smooth(cy+ry,120,y);
    const fx=front+waist;
    for(let x=0;x<W;x++){
      if(x<fx-0.5 || x>backX){ buf[(y*W+x)*4+3]=0; continue; }
      let shade=2;
      const u=(x-fx)/(backX-fx);           // 0 前緣 → 1 背
      if(Math.abs(ly)<1){
        const lit=(1-u)*1.2 - ly*0.7;      // 前凸受光
        shade=2+Math.round((lit-0.5)*2.2);
      } else shade=1+Math.round((1-u)*1.2);
      if(u>0.82) shade-=1;                  // 背側暗
      shade=Math.max(0,Math.min(4,shade));
      let col=C[shade];
      // 乳頭(前緣最凸點)
      const dn=Math.hypot((x-(fx))-0,(y-nipy)*1.1);
      if(x<fx+5 && Math.abs(y-nipy)<3.2*P.nsz){ col = (x<fx+2.4*P.nsz)?NP[0]:NP[1]; }
      set(x,y,col);
    }
  }
  // 前緣輪廓線
  const line=hx(SKINS[P.skin][0]);
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){ if(buf[(y*W+x)*4+3]){ set(x,y,x<64?line:C_edge()); break; } }
  }
  function C_edge(){ return hx(SKINS[P.skin][0]); }
}

function render(){ buf.fill(0); (P.view==='front'?renderFront:renderSide)(); ctx.putImageData(img,0,0); }

// ---- UI ----
const $=s=>document.querySelector(s);
$('#view').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  P.view=b.dataset.v; [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b)); render(); });
function bind(id,key,fmt){ const el=$('#'+id),v=$('#'+id+'-v');
  const u=()=>{P[key]=+el.value/100; v.textContent=fmt?fmt(+el.value):el.value+'%'; render();};
  el.addEventListener('input',u); u(); }
bind('size','size'); bind('droop','droop'); bind('gap','gap'); bind('nsz','nsz');
const skinWrap=$('#skin'), skinNames={porcelain:'瓷白',fair:'白皙',tan:'小麥',pink:'櫻粉',deep:'深棕'};
Object.keys(SKINS).forEach(key=>{ const b=document.createElement('button');
  b.innerHTML=`<span class="sw" style="background:${SKINS[key][3]}"></span>${skinNames[key]}`;
  if(key===P.skin)b.classList.add('on');
  b.onclick=()=>{P.skin=key;[...skinWrap.children].forEach(c=>c.classList.toggle('on',c===b));render();};
  skinWrap.appendChild(b); });
$('#export').onclick=()=>{ const a=document.createElement('a'); a.download='chest-128.png'; a.href=cv.toDataURL('image/png'); a.click(); };
$('#reset').onclick=()=>location.reload();
render();
})();
</script>
</body>
</html>
