<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素部件試畫</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px 16px 40px; background: #14101c; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 4px 0 10px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 12px; }
  .ctl label { display: flex; gap: 6px; align-items: center; }
  select { background: #241c30; color: #eee; border: 1px solid #4a3d5c; border-radius: 6px; padding: 3px 6px; }
  .card { background: #1d1727; border: 1px solid #33294a; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; color: #f3b6c6; }
  canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; background: repeating-conic-gradient(#221a2e 0 25%, #1a1424 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .small { color: #a99bbd; font-size: 12px; }
</style>
</head>
<body>
<h1>像素部件試畫（預產動圖模式）</h1>
<div class="ctl">
  <label>她膚色 <select id="skin"><option value="light">白</option><option value="medium">中</option><option value="tan">小麥</option></select></label>
  <label>陰唇 <select id="labia"><option value="pink">粉</option><option value="brown">咖啡</option><option value="dark">黑</option></select></label>
  <label>男方 <select id="mskin"><option value="medium">中</option><option value="light">白</option><option value="tan">小麥</option></select></label>
  <label>陰毛 <select id="hair"><option value="natural">自然</option><option value="bush">濃密</option><option value="trim">修剪</option><option value="none">無</option></select></label>
  <label>毛色 <select id="hcol"><option value="black">黑</option><option value="brown">棕</option><option value="blonde">金</option></select></label>
  <label>放大 <select id="scale"><option>4</option><option selected>6</option><option>8</option></select></label>
</div>
<div class="card"><h2>陰毛＋陰唇肉穴（M 字正面）</h2><canvas id="c-crotch"></canvas><div class="small" id="d-crotch"></div></div>
<div class="card"><h2>陰莖（側面）</h2><canvas id="c-penis"></canvas><div class="small" id="d-penis"></div></div>
<div class="row">
  <div class="card"><h2>陰唇（正面）</h2><canvas id="c-vulva"></canvas><div class="small" id="d-vulva"></div></div>
</div>
<div class="card"><h2>陰道（剖面，未插入）</h2><canvas id="c-cross"></canvas><div class="small" id="d-cross"></div></div>
<div class="card"><h2>組合：抽插 1-2-3-4（示範）</h2><canvas id="c-anim"></canvas><div class="small">首輪 1-2-3-4（300/180/180/300ms），之後 2-3-4 循環</div></div>
<script src="content/pixel_sex.js?v=3"></script>
<script>
(() => {
  const P = window.PixelSex;
  const $ = (id) => document.getElementById(id);
  const opt = () => ({ hair: $("hair").value, hairColor: $("hcol").value, skin: $("skin").value, labia: $("labia").value, maleSkin: $("mskin").value, scale: +$("scale").value });
  const DEPTHS = [2, 22, 42, 58];
  const HOLDS = [300, 180, 180, 300];
  let animFrames = [], fi = 0, first = true, timer = 0;
  function draw() {
    const o = opt();
    const cr = P.crotch({ skin: o.skin, labia: o.labia, hair: o.hair, hairColor: o.hairColor });
    P.render($("c-crotch"), cr, o.scale); $("d-crotch").textContent = `${cr.w}×${cr.h}px`;
    const pen = P.penis({ skin: o.maleSkin });
    P.render($("c-penis"), pen, o.scale); $("d-penis").textContent = `${pen.w}×${pen.h}px`;
    const vul = P.vulva({ skin: o.skin, labia: o.labia });
    P.render($("c-vulva"), vul, o.scale); $("d-vulva").textContent = `${vul.w}×${vul.h}px`;
    const cs = P.crossSection({ labia: o.labia, maleSkin: o.maleSkin });
    P.render($("c-cross"), cs, o.scale); $("d-cross").textContent = `${cs.w}×${cs.h}px`;
    animFrames = DEPTHS.map((d) => P.crossSection({ labia: o.labia, maleSkin: o.maleSkin, depth: d }));
    fi = 0; first = true;
    clearTimeout(timer); tick();
  }
  function tick() {
    P.render($("c-anim"), animFrames[fi], opt().scale);
    const hold = HOLDS[fi];
    fi = fi + 1;
    if (fi >= 4) { fi = 1; first = false; }
    timer = setTimeout(tick, hold);
  }
  for (const id of ["skin", "labia", "mskin", "scale", "hair", "hcol"]) $(id).addEventListener("change", draw);
  window.addEventListener("error", (e) => console.error(e.message));
  draw();
})();
</script>
</body>
</html>
