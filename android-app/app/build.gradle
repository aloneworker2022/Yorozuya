plugins {
    id 'com.android.application'
}

// 與 android-widget/ 共用同一把 debug 金鑰 → 不同機器 build 出來的 debug APK 可以互相覆蓋安裝。
// 找不到就退回 Android 預設的 ~/.android/debug.keystore。
def sharedDebugKeystore = rootProject.file('../android-widget/debug.keystore')

android {
    namespace 'tw.yorozuya.app'
    compileSdk 34

    defaultConfig {
        applicationId 'tw.yorozuya.app'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '8.2'
    }

    signingConfigs {
        debug {
            if (sharedDebugKeystore.exists()) {
                storeFile sharedDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
